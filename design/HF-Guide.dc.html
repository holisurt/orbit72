<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ORBIT 72 — Sổ tay (hi-fi)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#3DD6F5}a:hover{color:#8BE9FA}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.panel{background:#0F1830;border:1px solid #26355A;border-radius:14px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;color:#9AABC7;text-transform:uppercase}
.tab{min-height:48px;border-radius:12px;border:1px solid #26355A;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-align:left;padding:0 16px}
input{font-family:inherit;font-size:14px;min-height:42px;border:1px solid #3A4C78;border-radius:10px;padding:0 12px;box-sizing:border-box;width:100%;background:#16213D;color:#E8EEF8}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #070D1A; color: #E8EEF8; font-family: 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 56px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1A2647">
    <span style="font-weight: 800; letter-spacing: 0.06em">ORBIT <span style="color: #F5A524">72</span> <span style="font-weight: 600; color: #9AABC7; letter-spacing: 0">· Sổ tay Đội Rồng Con</span></span>
    <a href="HF-Home.dc.html" style="text-decoration: none; font-weight: 700; font-size: 14px">Đóng ✕</a>
  </div>
  <div style="flex: 1; display: flex; gap: 18px; padding: 18px 24px; min-height: 0">
    <div style="width: 250px; flex: none; display: flex; flex-direction: column; gap: 8px">
      <label for="q" class="lbl">Tìm trong sổ tay</label>
      <input id="q" placeholder="bóng tối, mặt phẳng, link budget…">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button class="tab" style="background: {{t.bg}}; color: {{t.fg}}; border-color: {{t.bd}}" onClick="{{t.pick}}">{{t.n}}</button>
      </sc-for>
      <div style="margin-top: auto; display: flex; align-items: flex-end; gap: 8px">
        <svg width="70" height="70" viewBox="0 0 120 120" aria-hidden="true"><rect x="8" y="46" width="26" height="30" rx="3" fill="#1E3A8A" stroke="#3DD6F5"></rect><rect x="86" y="46" width="26" height="30" rx="3" fill="#1E3A8A" stroke="#3DD6F5"></rect><rect x="34" y="34" width="52" height="56" rx="10" fill="#F5A524"></rect><path d="M44 34 L49 22 L55 34Z M65 34 L71 22 L76 34Z" fill="#FFD27A"></path><circle cx="50" cy="56" r="7" fill="#FFFFFF"></circle><circle cx="51" cy="57" r="3.5" fill="#0B1020"></circle><circle cx="70" cy="56" r="7" fill="#FFFFFF"></circle><circle cx="71" cy="57" r="3.5" fill="#0B1020"></circle><path d="M50 74 Q60 82 70 74" stroke="#0B1020" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
        <span style="font-size: 12px; color: #9AABC7; line-height: 1.4">{{tip}}</span>
      </div>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <span class="lbl" style="color: #F5A524">{{head}}</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; overflow: auto">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <div class="panel" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 5px">
            <span style="font-size: 15px; font-weight: 800">{{it.t}}</span>
            <span class="{{it.cls}}" style="font-size: 13px; line-height: 1.5; color: #C9D4E8">{{it.d}}</span>
            <span style="font-size: 11px; color: #7F90AE">{{it.s}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 2 }; }
  renderVals() {
    const T = [
      { n: 'Thuật ngữ', head: 'Thuật ngữ cơ bản', tip: 'Đọc trước khi ráp vệ tinh!', cls: '', items: [
        ['Mặt phẳng quỹ đạo · Orbital plane', 'Vệ tinh cùng mặt phẳng qua Hà Nội cùng khung giờ — muốn phủ cả ngày phải rải nhiều mặt phẳng.', 'Màn Quỹ đạo'],
        ['SSO · Sun-synchronous orbit', 'Qua mỗi nơi vào cùng giờ địa phương; ≈ 97,5° ở 520 km.', 'Màn Quỹ đạo'],
        ['Bóng tối · Eclipse', '≈ 37,6% mỗi vòng ở 520 km: vệ tinh sống nhờ pin.', 'Màn Ráp vệ tinh'],
        ['Store-and-forward', 'Nhận tin khi bay qua vùng bão, lưu lại, gửi xuống khi qua trạm.', 'Mission Control'],
        ['Biên đường truyền · Link margin', 'Phần tín hiệu dư so với mức tối thiểu; ≥ 3 dB là thông.', 'Màn Quỹ đạo'],
        ['Tồn lưu sau nhiệm vụ', 'Tuổi thọ quỹ đạo trừ thời gian vận hành; quy định FCC: ≤ 5 năm.', 'Yêu cầu R4']] },
      { n: 'Công thức', head: 'Công thức trong game (ví dụ 520 km)', tip: 'Mọi số trong game tính từ đây.', cls: 'mono', items: [
        ['Chu kỳ', 'T = 2π√(a³/μ) → 95,0 phút', '[CT]'],
        ['Bóng tối', 'f = arccos(√(h²+2R⊕h)/a)/π → 37,6%', '[CT] β = 0'],
        ['Vùng nhìn thấy trạm', 'λ = arccos(R⊕cos ε/a) − ε, ε = 10°', '[CT]'],
        ['Trôi nút do J2', 'Ω̇ = −1,5·J2·(R⊕/a)²·n·cos i', '[CT]'],
        ['Suy hao đường truyền', 'FSPL = 20log d + 20log f + 32,44', '[CT] d km, f MHz'],
        ['Điện sinh', 'S·η·k·(A/4)·(1−f)·k_tổn hao → 6U: 9,8 W', 'S [CT]; η, k [GA]']] },
      { n: 'Science · giả định', head: 'Mô hình đơn giản hóa ở đâu (Science)', tip: 'Nói rõ giới hạn là làm khoa học đúng cách.', cls: '', items: [
        ['Quỹ đạo tròn, 2 vật thể + J2', 'Bỏ qua lực cản trong 72 giờ, nhiễu Mặt Trăng, Mặt Trời.', 'Sai số nhỏ trong 72 h'],
        ['Bent-pipe Hà Nội ≈ Hòa Lạc', 'Trạm cách Hà Nội ~30 km nên coi như cùng một điểm nhìn.', 'Xấp xỉ hình học'],
        ['Bóng tối xấu nhất β = 0', 'Thực tế thay đổi theo mùa; game chọn trường hợp khó nhất.', 'Thiết kế an toàn'],
        ['Tuổi thọ từ bảng 6U thật', 'Nội suy log theo độ cao từ FACSAT-2 (B = 72,3 kg/m²).', 'arXiv:2609.24534'],
        ['Thông số trạm Hòa Lạc', 'Yagi 14 dBi, chảo S-band 3 m là giả định điển hình.', '[GA]'],
        ['Giá, linh kiện, ngưỡng chấm', 'Giá trị cân bằng game, không phải báo giá thật.', '[GA]']] },
      { n: 'Hồ sơ Rồng', head: 'Chuyện có thật', tip: 'Mỗi thẻ sự cố đều có gốc thật.', cls: '', items: [
        ['NanoDragon · 2021', 'CubeSat 3U, 3,8 kg, AIS, SSO ~560 km; mất liên lạc sau phóng.', 'Bài học: liên lạc dự phòng'],
        ['LOTUSat-1', 'Vệ tinh radar ~600 kg; lùi lịch phóng sang năm tài chính 2027 vì sự cố thử động cơ Epsilon.', 'Bài học: rủi ro hoãn phóng'],
        ['FACSAT-2 · 2023–2025', '6U dự kiến sống ≥ 5 năm, rơi sau 926 ngày vì chu kỳ Mặt Trời mạnh hơn dự báo.', 'Lý do có bảng “Mặt Trời cực đại”'],
        ['Bão Yagi · 9/2024', '6.285 trạm phát sóng mất liên lạc do mất điện ở 15 tỉnh, thành.', 'Động lực của 72 Giờ Vàng'],
        ['PicoDragon · 2013', 'Vệ tinh ~1 kg thả từ Trạm Vũ trụ Quốc tế.', 'Gợi ý lớp “Thang Máy ISS”'],
        ['Bão từ mạnh', 'Lực cản khí quyển tăng ~1,9 lần trong ngày bão mạnh.', 'Thẻ sự cố E1']] },
      { n: 'Nguồn', head: 'Nguồn dữ liệu và ghi công', tip: 'Không dùng logo NASA ở bất kỳ đâu.', cls: '', items: [
        ['NASA GPM IMERG', 'Lượng mưa bão Yagi 6–9/9/2024 cho bản đồ Mission Control.', 'GES DISC / Giovanni'],
        ['NASA Small Spacecraft SOA 2026', 'Khoảng thông số linh kiện; quy tắc rời quỹ đạo.', 'NASA Ames'],
        ['Natural Earth', 'Đường bờ biển, biên giới cho bản đồ và quả địa cầu.', 'Public domain'],
        ['arXiv:2609.24534 (2026)', 'Bảng tuổi thọ CubeSat 6U, hệ số lực cản khi bão từ.', 'Vargas Domínguez et al.'],
        ['Bộ TT&TT qua VnEconomy', 'Số trạm phát sóng mất liên lạc do bão Yagi.', '13/9/2024'],
        ['Font và hình vẽ', 'Be Vietnam Pro, IBM Plex Mono (SIL OFL); mascot, vệ tinh, patch vẽ gốc.', 'CREDITS.md']] }
    ];
    const cur = T[this.state.tab];
    return {
      tabs: T.map((t, q) => ({ n: t.n, bg: this.state.tab === q ? '#F5A524' : '#0F1830', fg: this.state.tab === q ? '#1A1205' : '#E8EEF8', bd: this.state.tab === q ? '#F5A524' : '#26355A', pick: () => this.setState({ tab: q }) })),
      head: cur.head, tip: cur.tip,
      items: cur.items.map(([t, d, s]) => ({ t, d, s, cls: cur.cls }))
    };
  }
}
</script>
</body>
</html>
